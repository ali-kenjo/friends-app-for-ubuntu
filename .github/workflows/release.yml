# Tag a version (git tag v0.3.0 && git push origin v0.3.0) and this builds the
# Linux desktop app as a .deb and as an AppImage, checks them, and publishes them
# as a GitHub Release with a checksum, so anyone can download and install it.
# (Friends only tells you when a newer release exists; it never installs one.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build the .deb and the AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Tools for packaging
        run: sudo apt-get update && sudo apt-get install -y imagemagick dpkg-dev squashfs-tools

      - name: Install dependencies (with Electron)
        # npm doesn't run Electron's own download any more, so it's done here
        run: npm ci && node node_modules/electron/install.js

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but package.json says $version"; exit 1; }

      - name: Sandbox for Missions (bubblewrap)
        # The Missions tests run commands in the same sandbox the app uses
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true

      - name: Checks and tests
        run: npm run check && npm test

      - name: Build
        run: |
          npm run dist
          npm run dist:appimage

      - name: Check the package
        run: |
          deb=$(ls dist/friends_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q './opt/friends/resources/app/server/server.js'
          appimage=$(ls dist/Friends-*-x86_64.AppImage)
          test -x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract usr/lib/friends/resources/app/server/server.js >/dev/null && test -f squashfs-root/usr/lib/friends/resources/app/server/server.js)
          (cd dist && sha256sum "$(basename "$deb")" "$(basename "$appimage")" > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: friends-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(node scripts/release-notes.js "${GITHUB_REF_NAME#v}")
          gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/*.AppImage dist/SHA256SUMS --title "Friends ${GITHUB_REF_NAME}" --notes "$notes"
